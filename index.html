<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Assistant — AI-Powered</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Geist:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #f6f4ef;
      --bg-elevated: #ffffff;
      --ink: #1a1a1a;
      --ink-muted: #6b6b66;
      --rule: #e3dfd5;
      --accent: #c8553d;

      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Geist", system-ui, sans-serif;

      --max-w: 1100px;
      --pad-x: clamp(1.25rem, 4vw, 2.5rem);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    .wrap {
      max-width: var(--max-w);
      margin: 0 auto;
      padding-left: var(--pad-x);
      padding-right: var(--pad-x);
    }

    /* NAV */
    header.nav {
      position: sticky;
      top: 0;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rule);
      z-index: 10;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
    }
    .logo {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
    }
    .logo span { color: var(--accent); }
    .nav-back {
      font-size: 0.9rem;
      color: var(--ink-muted);
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--ink); }

    /* HERO */
    .hero {
      padding: clamp(2.5rem, 6vw, 4rem) 0 clamp(2rem, 4vw, 3rem);
      border-bottom: 1px solid var(--rule);
    }
    .hero h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0 0 0.75rem;
    }
    .hero h1 em { font-style: italic; color: var(--accent); }
    .hero p {
      color: var(--ink-muted);
      max-width: 52ch;
      margin: 0;
      font-size: 1.05rem;
    }

    /* MAIN LAYOUT */
    .app-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      padding: clamp(2rem, 4vw, 3rem) 0;
    }
    @media (min-width: 860px) {
      .app-layout {
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }
    }

    /* INPUT PANEL */
    .input-panel {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .field-label {
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.5rem;
      display: block;
    }
    textarea {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.9rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--ink);
      resize: vertical;
      transition: border-color 0.2s;
      min-height: 160px;
    }
    textarea:focus {
      outline: none;
      border-color: var(--ink-muted);
    }
    textarea::placeholder { color: var(--ink-muted); opacity: 0.6; }

    .btn-generate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.85rem 1.75rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      width: 100%;
    }
    .btn-generate:hover:not(:disabled) { background: #2d2d2d; }
    .btn-generate:active:not(:disabled) { transform: scale(0.98); }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-generate.loading .spinner { display: block; }
    .btn-generate.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-msg {
      font-size: 0.85rem;
      color: var(--ink-muted);
      min-height: 1.4em;
      text-align: center;
    }

    /* OUTPUT PANEL */
    .output-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--rule);
    }
    .tab-btn {
      flex: 1;
      padding: 0.85rem 1rem;
      background: none;
      border: none;
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--ink-muted);
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab-btn.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
      font-weight: 500;
    }
    .tab-btn:hover:not(.active) { background: var(--bg); color: var(--ink); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .output-body {
      padding: 1.5rem;
      min-height: 300px;
    }
    .output-placeholder {
      color: var(--ink-muted);
      font-size: 0.95rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 260px;
      text-align: center;
      gap: 0.5rem;
    }
    .output-placeholder svg {
      opacity: 0.25;
      margin-bottom: 0.5rem;
    }

    .markdown-output {
      display: none;
    }
    .markdown-output h1, .markdown-output h2, .markdown-output h3 {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .markdown-output h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    .markdown-output h2 { font-size: 1.15rem; margin: 1.5rem 0 0.5rem; border-bottom: 1px solid var(--rule); padding-bottom: 0.25rem; }
    .markdown-output h3 { font-size: 1rem; margin: 1rem 0 0.25rem; }
    .markdown-output p { margin: 0 0 0.75rem; font-size: 0.95rem; }
    .markdown-output ul { margin: 0 0 0.75rem; padding-left: 1.25rem; }
    .markdown-output li { font-size: 0.95rem; margin-bottom: 0.2rem; }
    .markdown-output strong { font-weight: 600; }

    .output-actions {
      display: none;
      gap: 0.75rem;
      padding: 0 1.5rem 1.25rem;
      border-top: 1px solid var(--rule);
      padding-top: 1rem;
    }
    .btn-action {
      padding: 0.5rem 1rem;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: none;
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--ink-muted);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-action:hover { color: var(--ink); border-color: var(--ink-muted); }

    /* FOOTER */
    footer {
      padding: 2rem 0 2.5rem;
      border-top: 1px solid var(--rule);
      font-size: 0.85rem;
      color: var(--ink-muted);
    }
  </style>
</head>
<body>

  <header class="nav">
    <div class="wrap nav-inner">
      <span class="logo">Resume <span>Assistant</span></span>
      <a href="/" class="nav-back">← Portfolio</a>
    </div>
  </header>

  <main>
    <div class="hero">
      <div class="wrap">
        <h1>Your resume, <em>tailored</em> in seconds.</h1>
        <p>Paste a job description and your background. Claude drafts a targeted resume and cover letter — streamed live.</p>
      </div>
    </div>

    <div class="wrap">
      <div class="app-layout">

        <!-- INPUT -->
        <div class="input-panel">
          <div>
            <label class="field-label" for="job-description">Job Description</label>
            <textarea
              id="job-description"
              placeholder="Paste the full job posting here — title, responsibilities, requirements..."
              rows="8"
            ></textarea>
          </div>
          <div>
            <label class="field-label" for="candidate-background">Your Background</label>
            <textarea
              id="candidate-background"
              placeholder="Share your experience, skills, education, and key accomplishments. The more detail, the better the output."
              rows="10"
            ></textarea>
          </div>
          <button class="btn-generate" id="generate-btn" onclick="generate()">
            <div class="spinner"></div>
            <span class="btn-text">Generate Resume &amp; Cover Letter</span>
          </button>
          <p class="status-msg" id="status-msg"></p>
        </div>

        <!-- OUTPUT -->
        <div class="output-panel">
          <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('resume', this)">Resume</button>
            <button class="tab-btn" onclick="switchTab('cover-letter', this)">Cover Letter</button>
          </div>

          <div class="tab-content active" id="tab-resume">
            <div class="output-body">
              <div class="output-placeholder" id="placeholder-resume">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="16" y1="13" x2="8" y2="13"/>
                  <line x1="16" y1="17" x2="8" y2="17"/>
                  <polyline points="10 9 9 9 8 9"/>
                </svg>
                Your tailored resume will appear here.
              </div>
              <div class="markdown-output" id="resume-output"></div>
            </div>
            <div class="output-actions" id="actions-resume">
              <button class="btn-action" onclick="copyContent('resume')">Copy</button>
              <button class="btn-action" onclick="downloadContent('resume', 'resume.txt')">Download .txt</button>
            </div>
          </div>

          <div class="tab-content" id="tab-cover-letter">
            <div class="output-body">
              <div class="output-placeholder" id="placeholder-cover-letter">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
                Your cover letter will appear here.
              </div>
              <div class="markdown-output" id="cover-letter-output"></div>
            </div>
            <div class="output-actions" id="actions-cover-letter">
              <button class="btn-action" onclick="copyContent('cover-letter')">Copy</button>
              <button class="btn-action" onclick="downloadContent('cover-letter', 'cover_letter.txt')">Download .txt</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">Powered by Claude Opus 4.7 · Kalyan Samminga</div>
  </footer>

  <script>
    const RESUME_MARKER = '<<<RESUME>>>';
    const COVER_LETTER_MARKER = '<<<COVER_LETTER>>>';

    let rawResume = '';
    let rawCoverLetter = '';
    let currentSection = null; // 'resume' | 'cover-letter' | null
    let buffer = '';

    function switchTab(tabName, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function setStatus(msg) {
      document.getElementById('status-msg').textContent = msg;
    }

    function setLoading(on) {
      const btn = document.getElementById('generate-btn');
      btn.classList.toggle('loading', on);
      btn.disabled = on;
    }

    function showOutput(section, rawText) {
      const placeholder = document.getElementById('placeholder-' + section);
      const output = document.getElementById(section + '-output');
      const actions = document.getElementById('actions-' + section);

      placeholder.style.display = 'none';
      output.style.display = 'block';
      output.innerHTML = marked.parse(rawText);
      actions.style.display = 'flex';
    }

    function processBuffer() {
      // Check for section markers in buffer
      if (buffer.includes(RESUME_MARKER)) {
        const parts = buffer.split(RESUME_MARKER);
        buffer = parts[parts.length - 1];
        currentSection = 'resume';
        rawResume = '';
      }
      if (buffer.includes(COVER_LETTER_MARKER)) {
        const parts = buffer.split(COVER_LETTER_MARKER);
        // Everything before the marker belongs to resume
        if (currentSection === 'resume') {
          rawResume += parts[0];
          showOutput('resume', rawResume.trim());
        }
        buffer = parts[parts.length - 1];
        currentSection = 'cover-letter';
        rawCoverLetter = '';
      }

      // Route remaining buffer to current section
      if (currentSection === 'resume') {
        rawResume += buffer;
        showOutput('resume', rawResume.trim());
        buffer = '';
      } else if (currentSection === 'cover-letter') {
        rawCoverLetter += buffer;
        showOutput('cover-letter', rawCoverLetter.trim());
        buffer = '';
      }
    }

    async function generate() {
      const jobDescription = document.getElementById('job-description').value.trim();
      const candidateBackground = document.getElementById('candidate-background').value.trim();

      if (!jobDescription || !candidateBackground) {
        setStatus('Please fill in both fields before generating.');
        return;
      }

      // Reset state
      rawResume = '';
      rawCoverLetter = '';
      currentSection = null;
      buffer = '';

      ['resume', 'cover-letter'].forEach(s => {
        document.getElementById('placeholder-' + s).style.display = 'flex';
        document.getElementById(s + '-output').style.display = 'none';
        document.getElementById(s + '-output').innerHTML = '';
        document.getElementById('actions-' + s).style.display = 'none';
      });

      setLoading(true);
      setStatus('Connecting to Claude...');

      try {
        const response = await fetch('/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ job_description: jobDescription, candidate_background: candidateBackground }),
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || 'Server error');
        }

        setStatus('Generating — this takes about 30 seconds...');

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let sseBuffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          sseBuffer += decoder.decode(value, { stream: true });
          const lines = sseBuffer.split('\n');
          sseBuffer = lines.pop(); // keep incomplete line

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = JSON.parse(line.slice(6));

            if (payload.error) throw new Error(payload.error);
            if (payload.done) break;
            if (payload.text) {
              buffer += payload.text;
              processBuffer();
            }
          }
        }

        // Flush any remaining buffer
        if (buffer.trim()) {
          if (currentSection === 'resume') {
            rawResume += buffer;
            showOutput('resume', rawResume.trim());
          } else if (currentSection === 'cover-letter') {
            rawCoverLetter += buffer;
            showOutput('cover-letter', rawCoverLetter.trim());
          }
        }

        setStatus('Done.');
      } catch (err) {
        setStatus('Error: ' + err.message);
      } finally {
        setLoading(false);
      }
    }

    function getRawText(section) {
      return section === 'resume' ? rawResume : rawCoverLetter;
    }

    function copyContent(section) {
      const text = getRawText(section).trim();
      navigator.clipboard.writeText(text).then(() => {
        setStatus('Copied to clipboard.');
        setTimeout(() => setStatus(''), 2000);
      });
    }

    function downloadContent(section, filename) {
      const text = getRawText(section).trim();
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
